[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --junit-xml=test_results.xml
    --cov=servimed
    --cov-report=html
    --cov-report=term-missing

markers = 
    unit: Testes unitários rápidos
    integration: Testes de integração que podem demorar
    celery: Testes relacionados ao Celery
    scrapy: Testes relacionados aos spiders Scrapy
    api: Testes que fazem chamadas para API externa (mock por padrão)

env = 
    TESTING = true
    REDIS_URL = redis://localhost:6379/15
    SERVIMED_USER = test_user
    SERVIMED_PASS = test_pass

# Configuração do asyncio para pytest-asyncio
asyncio_default_fixture_loop_scope = function